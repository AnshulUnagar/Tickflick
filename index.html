/* Layout: a plain white page, always light. One narrow column: task list, or a swipe pager of outlined cards with a chapter bar above and a recap card at the end. Black ink only; shapes are slightly lopsided, shadows are hard offsets. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #000000;
  --ink-2: #2E2E2E;
  --on-ink: #FFFFFF;
  --dot: rgba(10, 10, 10, .17);
  --rule: rgba(10, 10, 10, .22);
  --hatch: repeating-linear-gradient(-45deg, var(--ink) 0 2.5px, transparent 2.5px 6px);
  --r-lg: 18px 10px 22px 8px / 10px 20px 8px 18px;
  --r-md: 12px 6px 14px 6px / 6px 14px 6px 12px;
  --r-sm: 8px 4px 9px 4px / 4px 9px 4px 8px;
  --font-display: 'Londrina Solid', 'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive;
  --font-sketch: 'Londrina Sketch', 'Londrina Solid', 'Chalkboard SE', 'Comic Sans MS', cursive;
  --font-body: 'Patrick Hand', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  --gutter: 16px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  color: var(--ink);
  font: 400 19px/1.35 var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
textarea, input { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { width: 100%; max-width: 600px; margin-inline: auto; }
.mono { font-family: var(--font-body); font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

#app { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }
#scenery { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; opacity: .26; }

/* Header */
.top { padding: 14px var(--gutter) 12px; }
.top-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand svg.mark { width: 30px; height: 30px; color: var(--ink); flex: none; }
.brand h1 { position: relative; margin: 0; font: 900 34px/1 var(--font-display); letter-spacing: .01em; padding-bottom: 6px; }
.squig { position: absolute; left: 0; bottom: -2px; width: 100%; height: 8px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.seg { display: inline-flex; gap: 8px; }
.seg button {
  border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--surface); color: var(--ink);
  font: 400 21px/1 var(--font-display); letter-spacing: .05em; padding: 9px 15px 7px;
}
.seg button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.meter { flex: 1; height: 16px; border: 2.5px solid var(--ink); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.meter i { display: block; height: 100%; width: 0; background: var(--hatch); transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.tally { white-space: nowrap; font-variant-numeric: tabular-nums; }
.sndbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--surface); color: var(--ink); }
.sndbtn svg { width: 22px; height: 22px; }
.sndbtn .sp { fill: currentColor; }
.sndbtn .wv { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.sndbtn[aria-pressed="false"] .wv-on { display: none; }
.sndbtn[aria-pressed="true"] .wv-off { display: none; }

/* List view */
#listView { flex: 1; min-height: 0; overflow-y: auto; padding: 8px calc(var(--gutter) + 4px) 32px var(--gutter); }
.add { display: flex; gap: 10px; margin-bottom: 18px; }
.add input {
  flex: 1; min-width: 0; padding: 10px 13px 8px; background: var(--surface); border: 2.5px solid var(--ink); border-radius: var(--r-md); font-size: 20px;
}
.add input::placeholder { color: var(--ink-2); opacity: .85; }
.btn {
  border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--ink); color: var(--on-ink);
  font: 400 22px/1 var(--font-display); letter-spacing: .05em; min-height: 46px; padding: 4px 20px 0;
  box-shadow: 4px 4px 0 0 var(--bg), 4px 4px 0 2.5px var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 var(--bg), 2px 2px 0 2.5px var(--ink); }
.btn.quiet { background: var(--surface); color: var(--ink); }
.panel { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-lg); box-shadow: 5px 5px 0 var(--ink); overflow: hidden; }
.panel ul { list-style: none; margin: 0; padding: 0; }
.row { position: relative; overflow: hidden; border-top: 2px dashed var(--ink-2); }
.rowin { display: grid; grid-template-columns: 54px minmax(0, 1fr) 28px; align-items: center; min-height: 64px; background: var(--surface); touch-action: pan-y; position: relative; will-change: transform; }
.rowin.snap { transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
.swipe-bg { position: absolute; inset: 0; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-right: 22px; font: 400 22px/1 var(--font-display); letter-spacing: .06em; opacity: 0; }
.swipe-bg svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.row.swiping .swipe-bg { opacity: 1; }
.row.swiping.ready .swipe-bg span { text-decoration: underline wavy; }
.row.leaving { transition: max-height .25s ease .1s, opacity .25s ease .1s; max-height: 0 !important; opacity: 0; border-top-width: 0; }
.row:first-child { border-top: 0; }
.check { width: 54px; height: 64px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.check .dot {
  width: 27px; height: 27px; border: 2.5px solid var(--ink); border-radius: var(--r-sm); background: var(--surface);
  display: grid; place-items: center; transition: background .15s;
}
.check svg, .donebtn svg { width: 16px; height: 16px; fill: none; stroke: var(--on-ink); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check svg path, .donebtn svg path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .4s cubic-bezier(.3, .7, .2, 1) .05s; }
.row.done .check .dot { background: var(--ink); }
.row.done .check svg { opacity: 1; }
.row.done .check svg path { stroke-dashoffset: 0; }
.row-main { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 1px; padding: 10px 0; min-width: 0; align-self: stretch; justify-content: center; font-family: var(--font-body); }
.row-main:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.rt { font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.row.done .rt { color: var(--ink-2); text-decoration: line-through wavy; text-decoration-thickness: 1.5px; }
.rm { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.chev { font: 400 30px/1 var(--font-display); text-align: center; }
.listbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.selact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
.selact .mono { width: 100%; }
.mini {
  border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--surface); color: var(--ink);
  font: 400 20px/1 var(--font-display); letter-spacing: .04em; min-height: 42px; padding: 6px 14px 3px;
}
.mini:active:not(:disabled) { transform: translate(1px, 1px); }
.mini:disabled { opacity: .3; cursor: default; }
.mini.solid { background: var(--ink); color: var(--on-ink); }
.row.sel-mode .rowin { grid-template-columns: 54px minmax(0, 1fr); }
.row.sel-mode .check .dot { background: var(--surface); border-color: var(--ink); }
.row.sel-mode .check svg { opacity: 0; }
.row.picked .rowin { background: var(--ink); color: var(--on-ink); }
.row.picked .rt, .row.picked .rm { color: var(--on-ink); }
.row.picked .check .dot { background: var(--on-ink); border-color: var(--on-ink); }
.row.picked .check svg { opacity: 1; stroke: var(--ink); }
.row.picked .check svg path { stroke-dashoffset: 0; }
.empty { padding: 30px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.empty h2 { margin: 0; font: 900 30px/1.05 var(--font-display); text-wrap: balance; }
.empty p { margin: 0; color: var(--ink-2); max-width: 44ch; font-size: 20px; }
.empty .add { width: 100%; margin: 0; }
.note { margin: 16px 2px 0; }
.intro .row { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }

/* Cards view */
#cardsView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.story { padding: 2px var(--gutter) 2px; }
.story .wrap { max-width: 560px; display: flex; align-items: center; gap: 12px; }
.rail { display: flex; gap: 4px; flex: 1; min-width: 0; height: 30px; }
.rail button { flex: 1 1 0; min-width: 3px; padding: 0; border: 0; background: none; position: relative; }
.rail button::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; bottom: 10px; border: 2px solid var(--ink); border-radius: 4px; background: var(--surface); }
.rail button i { position: absolute; left: 2px; top: 12px; bottom: 12px; width: 0; border-radius: 2px; background: var(--hatch); }
.rail button.is-done i { background: var(--ink); }
.rail button.is-past i, .rail button.is-cur i { width: calc(100% - 4px); }
.rail button.is-cur::before { top: 7px; bottom: 7px; }
.rail button.is-cur i { top: 9px; bottom: 9px; }
.rail.playing button.is-cur i { width: 0; animation: fill var(--story-ms, 6000ms) linear forwards; }
.rail.paused button.is-cur i { animation-play-state: paused; }
@keyframes fill { to { width: calc(100% - 4px); } }
.pill {
  display: inline-flex; align-items: center; gap: 7px; flex: none; min-height: 40px; padding: 5px 14px 2px 10px;
  border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--surface); color: var(--ink);
  font: 400 20px/1 var(--font-display); letter-spacing: .04em;
}
.pill svg { width: 15px; height: 15px; fill: currentColor; margin-bottom: 3px; }
.pill .i-pause { display: none; }
.pill[aria-pressed="true"] .i-play { display: none; }
.pill[aria-pressed="true"] .i-pause { display: block; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.pager {
  flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.pager::-webkit-scrollbar { display: none; }
.pager.dragging { scroll-snap-type: none; cursor: grabbing; user-select: none; -webkit-user-select: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 10px calc(var(--gutter) + 6px) 24px var(--gutter); cursor: grab; }
.slide textarea, .slide button, .slide label { cursor: auto; }
.slide button { cursor: pointer; }
.card {
  max-width: 560px; margin-inline: auto; background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r-lg);
  box-shadow: 6px 6px 0 var(--ink); padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px;
  transform: translateX(calc(var(--p, 0) * -26px)) scale(calc(1 - var(--a, 0) * .07));
  opacity: calc(1 - var(--a, 0) * .5);
  will-change: transform;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.idx { display: flex; align-items: baseline; gap: 10px; }
.idx b { font: 400 68px/.85 var(--font-sketch); font-variant-numeric: tabular-nums; }
.donebtn {
  display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px 4px 9px; min-height: 42px; border-radius: var(--r-md);
  border: 2.5px solid var(--ink); background: var(--surface); color: var(--ink); font: 400 21px/1 var(--font-display); letter-spacing: .04em;
  transition: background .2s, color .2s;
}
.donebtn .box { width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: var(--r-sm); display: grid; place-items: center; margin-bottom: 3px; transition: border-color .2s; }
.donebtn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.donebtn[aria-pressed="true"] .box { border-color: var(--on-ink); }
.donebtn[aria-pressed="true"] svg { opacity: 1; }
.donebtn[aria-pressed="true"] svg path { stroke-dashoffset: 0; }
.donebtn.pulse { animation: ping .65s ease-out; }
@keyframes ping { from { box-shadow: 0 0 0 0 var(--ink); } to { box-shadow: 0 0 0 14px transparent; } }
.field-label { font-size: 16px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
.title {
  width: 100%; resize: none; overflow: hidden; border: 0; border-bottom: 3px dashed var(--ink); border-radius: 0; background: transparent;
  padding: 2px 0 8px; font: 900 36px/1.02 var(--font-display); letter-spacing: .01em; text-wrap: balance;
}
.title:focus { outline: none; border-bottom-style: solid; }
.rsum { grid-column: 2 / -1; padding: 0 12px 12px 0; display: grid; gap: 10px; justify-items: start; }
.rsum .sumpanel { justify-self: stretch; }
.sumbtn {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 14px 4px 12px; margin-top: -2px;
  border: 2.5px solid var(--ink); border-radius: var(--r-sm); background: var(--bg); color: var(--ink);
  font: 400 17px/1 var(--font-body); cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
}
.sumbtn { margin-top: 0 !important; }
.sumbtn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.sumbtn .car { width: 12px; height: 12px; transition: transform .25s; }
.sumbtn[aria-expanded="true"] .car { transform: rotate(180deg); }
.sumbtn[aria-expanded="true"] { background: var(--ink); color: var(--on-ink); }
.sumpanel {
  border: 2.5px dashed var(--ink); border-radius: var(--r-md); padding: 12px 14px; background: var(--surface);
  display: grid; gap: 10px; animation: sumin .28s ease-out;
}
.sumpanel[hidden] { display: none; }
@keyframes sumin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.sum-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.sum-stat { border: 2px solid var(--ink); border-radius: var(--r-sm); padding: 3px 10px; font-size: 16px; line-height: 1.2; background: var(--bg); }
.sum-stat.on { background: var(--ink); color: var(--on-ink); }
.sum-text { margin: 0; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.sum-text.empty { color: var(--ink-2); opacity: .8; }
@media (prefers-reduced-motion: reduce) { .sumpanel { animation: none; } .sumbtn .car { transition: none; } }
.title::placeholder, .notes::placeholder { color: var(--ink-2); opacity: .75; }
.notes {
  width: 100%; min-height: 150px; resize: vertical; border: 2.5px solid var(--ink); border-radius: var(--r-md); padding: 6px 13px 7px;
  font-size: 20px; line-height: 27px;
  background-color: var(--surface);
  background-image: repeating-linear-gradient(to bottom, transparent 0 26px, var(--rule) 26px 27px);
  background-position: 0 6px; background-attachment: local;
}
.notes:focus { outline: none; box-shadow: 3px 3px 0 var(--ink); }
.photos-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.photos-head .field-label { margin: 0; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 4px 4px 6px 2px; }
.thumb {
  position: relative; aspect-ratio: 1; max-width: 100%; padding: 4px; overflow: hidden; background: var(--surface);
  border: 2.5px solid var(--ink); border-radius: var(--r-sm); box-shadow: 3px 3px 0 var(--ink);
}
.thumb:nth-child(odd) { rotate: -1.6deg; }
.thumb:nth-child(even) { rotate: 1.3deg; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 3px; }
.thumb.busy { display: grid; place-items: center; font-size: 16px; letter-spacing: .1em; color: var(--ink-2); cursor: default; animation: pulse 1.2s ease-in-out infinite; box-shadow: none; border-style: dashed; }
.thumb.broken::after { content: 'Missing'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; color: var(--ink-2); background: var(--surface); }
@keyframes pulse { 50% { opacity: .5; } }
.addphoto {
  aspect-ratio: 1; max-width: 100%; border: 2.5px dashed var(--ink); border-radius: var(--r-sm); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; cursor: pointer; color: var(--ink); font: 400 19px/1 var(--font-display); letter-spacing: .04em; text-align: center; padding: 6px;
}
@media (hover: hover) { .addphoto:hover { border-style: solid; } }
.addphoto:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
.addphoto svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.card-foot { margin-top: 10px; padding-top: 12px; border-top: 2px dashed var(--ink-2); display: flex; }
.del { border: 0; background: none; color: var(--ink); font: 400 20px/1 var(--font-body); text-decoration: underline wavy; text-underline-offset: 4px; padding: 10px 0; min-height: 42px; }

/* Story motion: a card's contents stay hidden until it becomes the active chapter, then rise in one after another. */
.card > * { opacity: 0; }
.card > *:nth-child(1) { --k: 0; } .card > *:nth-child(2) { --k: 1; } .card > *:nth-child(3) { --k: 2; }
.card > *:nth-child(4) { --k: 3; } .card > *:nth-child(5) { --k: 4; } .card > *:nth-child(6) { --k: 5; }
.card > *:nth-child(7) { --k: 6; } .card > *:nth-child(8) { --k: 7; } .card > *:nth-child(9) { --k: 8; }
.slide.is-active .card > * { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--k, 0) * 80ms); }
.slide.entering .thumb:not(.busy) { animation: pop .55s cubic-bezier(.2, .8, .3, 1.15) both; animation-delay: calc(320ms + var(--i, 0) * 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: none; } }

/* Recap card at the end of the story */
.endcard { align-items: center; text-align: center; padding-block: 26px; }
.ring { position: relative; width: 184px; height: 184px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; }
.ring .trk { stroke: var(--ink-2); stroke-width: 4; stroke-dasharray: 2 9; stroke-linecap: round; }
.ring .arc { stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: var(--off, 326.7); }
.slide.is-active .ring .arc { animation: ring 1.2s .35s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes ring { from { stroke-dashoffset: 326.7; } }
.big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
.big b { font: 400 78px/.9 var(--font-sketch); font-variant-numeric: tabular-nums; }
.end-title { margin: 6px 0 0; font: 900 32px/1.05 var(--font-display); text-wrap: balance; }
.end-sub { margin: 0; color: var(--ink-2); max-width: 34ch; font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chip { max-width: 100%; border: 2.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 5px 12px 3px; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .chip:hover { background: var(--ink); color: var(--on-ink); } }
.end-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 6px; padding-right: 4px; }

.pager-nav { padding: 6px calc(var(--gutter) + 4px) 14px var(--gutter); }
.pager-nav .wrap { max-width: 560px; display: flex; align-items: center; gap: 10px; }
.nbtn {
  flex: none; width: 48px; height: 48px; border: 2.5px solid var(--ink); border-radius: var(--r-md); background: var(--surface); color: var(--ink);
  display: grid; place-items: center; padding: 0; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.nbtn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.nbtn:disabled { opacity: .3; cursor: default; box-shadow: none; }
.nbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.nbtn.plus { background: var(--ink); color: var(--on-ink); }
.mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pos { font-variant-numeric: tabular-nums; line-height: 1.1; }
.hint { display: inline-flex; align-items: center; gap: 6px; font-size: 18px; color: var(--ink-2); line-height: 1.1; }
.hint svg { width: 36px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(6px); } }
#cardsEmpty { padding: 8px calc(var(--gutter) + 6px) 8px var(--gutter); }
#cardsEmpty .panel { max-width: 560px; margin-inline: auto; }

/* Photo viewer */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(6, 6, 6, .95); display: flex; flex-direction: column; color: #F5F5F5; }
.lb-top, .lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--gutter); }
.lb-top { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.lb-bar { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.lb button { border: 2.5px solid #F5F5F5; background: transparent; color: #F5F5F5; border-radius: var(--r-md); min-height: 44px; padding: 4px 18px 0; font: 400 20px/1 var(--font-display); letter-spacing: .04em; }
.lb button:disabled { opacity: .3; cursor: default; }
.lb button.warn { border-style: dashed; }
.lb-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 var(--gutter); }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid #F5F5F5; border-radius: 4px; background: #F5F5F5; }
.lb-count { font: 400 22px/1 var(--font-display); letter-spacing: .1em; }
.lb-step { display: flex; gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: calc(100% - 2 * var(--gutter)); background: var(--ink); color: var(--on-ink); padding: 10px 16px 8px; border-radius: var(--r-md); font-size: 19px;
}

    if (inBox(px, py, sun.x, sun.y, 23, 23, 6)) { sun.blink = 2.2; say('chirp'); return; }
    for (i = 0; i < birds.length; i++) {
      var b = birds[i]; if (inBox(px, py, b.x, b.y, 22, 14, 8)) { b.scare = 1.2; puff(b.x + 11, b.y + 8, 5); say('chirp'); hit = true; break; }
    }
    if (hit) return;
    for (i = 0; i < cl.length; i++) {
      var c = cl[i]; if (inBox(px, py, c.x, c.y, c.s.width, c.s.height, 6)) { c.boost = 40; puff(c.x + c.s.width / 2, c.y + 8, 10); say('puff'); return; }
    }
    if (!pet.air && inBox(px, py, pet.x, GY - 12, 24, 13, 8)) { pet.air = true; pet.vy = -65; say('meow'); return; }
    for (i = 0; i < cactiOn.length; i++) {
      var k = cactiOn[i]; if (!k.hop && inBox(px, py, k.x, GY - k.h, k.w, k.h, 10)) { k.hop = true; k.vy = -70; say('boing'); return; }
    }
    if (t - lastTap > 2.5 && birds.length < 3) {   /* tapping empty sky calls a bird */
      lastTap = t;
      var dir = px > W / 2 ? -1 : 1, bd = newBird(px, Math.min(py, GY - 30), dir);
      if (dir > 0) bd.v = Math.abs(bd.v);
      birds.push(bd); puff(px, py, 6); say('chirp');
    }
  }, true);

  layout(); draw(); start();
})();
</script>
